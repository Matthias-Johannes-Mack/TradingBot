name: Release

# Every merge to main that changes code: run the tests, work out the next
# semantic version, push the image, then tag the commit and publish a GitHub
# release. The tag is created last, so a failed test, build or push never
# leaves a version tag without an image behind it.
#
# The image always goes to the GitHub Container Registry (free for public
# repositories, no setup). It also goes to Docker Hub when the repository
# variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN are set.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/CODEOWNERS"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increase (auto reads the commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Releases run one at a time, so two merges can never claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Same repository name on both registries (Docker Hub: wirefire071/trading-bot).
  IMAGE_NAME: trading-bot

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  version:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            next=0.1.0
            echo "No version tag yet; the first release is v$next."
          else
            if [ -z "$(git rev-list "$last..HEAD")" ]; then
              echo "No commits since $last; nothing to release."
              exit 0
            fi
            if [ "$BUMP" = auto ]; then
              # Conventional commits: "feat!:" or "BREAKING CHANGE" -> major, "feat:" -> minor, else patch.
              log=$(git log --format='%s%n%b' "$last..HEAD")
              if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<<"$log"; then
                BUMP=major
              elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then
                BUMP=minor
              else
                BUMP=patch
              fi
            fi
            IFS=. read -r major minor patch <<<"${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *) next="$major.$minor.$((patch + 1))" ;;
            esac
            echo "$last -> v$next ($BUMP)"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      ghcr: ${{ steps.targets.outputs.ghcr }}
      dockerhub: ${{ steps.targets.outputs.dockerhub }}
    steps:
      - name: Choose registries
        id: targets
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Registry paths must be lowercase; GitHub owner names may not be.
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          dockerhub=""
          if [ -n "$DOCKERHUB_USERNAME" ] && [ "$HAS_TOKEN" = true ]; then
            dockerhub="docker.io/${DOCKERHUB_USERNAME,,}/$IMAGE_NAME"
          else
            echo "::notice title=Docker Hub skipped::Publishing to GitHub Container Registry only. To also push to Docker Hub, add the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN."
          fi
          {
            echo "ghcr=$ghcr"
            echo "dockerhub=$dockerhub"
            echo "images<<IMAGES"
            echo "$ghcr"
            if [ -n "$dockerhub" ]; then echo "$dockerhub"; fi
            echo "IMAGES"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Guardrail
            org.opencontainers.image.description=Paper-trading autopilot driven by free public research data
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Build provenance and a software bill of materials travel with the image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          GHCR_IMAGE: ${{ needs.image.outputs.ghcr }}
          DOCKERHUB_IMAGE: ${{ needs.image.outputs.dockerhub }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          {
            echo "Docker image, also tagged \`latest\`:"
            echo
            echo '```bash'
            echo "docker pull $GHCR_IMAGE:$VERSION"
            if [ -n "$DOCKERHUB_IMAGE" ]; then echo "docker pull $DOCKERHUB_IMAGE:$VERSION"; fi
            echo '```'
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file notes.md
